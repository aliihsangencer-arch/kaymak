<!doctype html><html lang="tr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>k-Koçluk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<meta name="theme-color" content="#BA2C50">
</head><body>
<style>
:root{
  --bg:#F2F3F0;--surface:#FFFFFF;--surface-2:#F7F8F5;--ink:#1B2130;--muted:#5B6271;--line:#DADDD6;
  --accent:#BA2C50;--accent-ink:#FFFFFF;--accent-soft:#F8E3E9;
  --ok:#2A7955;--ok-soft:#E0EFE7;--warn:#9F6512;--warn-soft:#F5EAD5;--bad:#B3261E;--bad-soft:#F7E0DE;--neutral:#BCC1C9;--extra:#2A5DA8;--extra-soft:#E2EBF8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101318;--surface:#181C24;--surface-2:#1D222B;--ink:#E6E8ED;--muted:#9BA2AF;--line:#2B313C;
    --accent:#EE7593;--accent-ink:#1A0D12;--accent-soft:#3A1E28;
    --ok:#5DC190;--ok-soft:#163026;--warn:#E2A94D;--warn-soft:#33270F;--bad:#F07B71;--bad-soft:#3A1A18;--neutral:#4A515E;--extra:#8DB6F2;--extra-soft:#1B2A42;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101318;--surface:#181C24;--surface-2:#1D222B;--ink:#E6E8ED;--muted:#9BA2AF;--line:#2B313C;
  --accent:#EE7593;--accent-ink:#1A0D12;--accent-soft:#3A1E28;
  --ok:#5DC190;--ok-soft:#163026;--warn:#E2A94D;--warn-soft:#33270F;--bad:#F07B71;--bad-soft:#3A1A18;--neutral:#4A515E;--extra:#8DB6F2;--extra-soft:#1B2A42;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600;font-family:var(--body)}
p{margin:0}
small,.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:22px 16px}
.side-top{display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font:700 16px var(--display);color:var(--accent);position:relative}
.logo::after{content:"";position:absolute;right:-4px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.brand b{font:700 20px var(--display);letter-spacing:-.01em}
.who label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
main{padding-block:28px 72px;padding-inline:clamp(16px,3.2vw,44px);min-width:0;display:flex;flex-direction:column;gap:22px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{height:auto;position:sticky;z-index:10;padding:12px 16px 8px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .side-top{flex-direction:row;gap:12px;align-items:end;justify-content:space-between}
  .who{flex:1;max-width:260px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .side-foot{display:none}
}

.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ph-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tile .v{font:600 26px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:13px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:500;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=number]{width:84px}
.w-s{width:110px}.w-m{width:170px}.w-l{width:240px}.grow{flex:1 1 200px}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 6px}

.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.t tfoot td{font-weight:600;border-top:1px solid var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font:11px var(--mono)}
.chart .val{fill:var(--ink);font:600 12px var(--mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.end{fill:var(--accent)}
.chart .b-d{fill:var(--ok)} .chart .b-y{fill:var(--bad)} .chart .b-b{fill:var(--neutral)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* program */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
@media (max-width:1180px){.week{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-weight:600}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:6px;align-items:flex-start;justify-content:space-between;background:var(--surface-2);border-radius:7px;padding:7px 8px;font-size:13px}
.task label{display:flex;gap:7px;align-items:flex-start;cursor:pointer;min-width:0}
.task label span{min-width:0;overflow-wrap:anywhere}
.task.done label span{color:var(--muted);text-decoration:line-through}
.task .btn{flex:none}

/* optik */
.kb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:600 11px var(--mono);cursor:pointer;padding:0}
.kb.on{background:var(--accent);color:var(--accent-ink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:4px 18px}
.qrow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.qn{font:600 12px var(--mono);color:var(--accent);width:24px;text-align:right;flex:none}
.keys{display:flex;gap:4px;flex:none}
.qrow select{flex:1;min-width:0;font-size:13px;padding:4px 6px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec > summary{cursor:pointer;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;list-style:none}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::before{content:"+";font:600 16px var(--mono);color:var(--accent);width:14px}
details.sec[open] > summary::before{content:"–"}
details.sec > summary h3{font-size:16px;font-family:var(--display)}
.sec-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}

.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.ov-top .clock{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.tab{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;gap:0;white-space:nowrap;font-size:13px}
.tab small{font-family:var(--mono);font-size:11px}
.tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.sheet{margin:14px 16px 40px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:16px;position:relative}
.sheet-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px;color:var(--accent);font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.orow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:0 28px}
.bub{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:600 12px var(--mono);cursor:pointer;padding:0;touch-action:manipulation}
.bub.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.paused .ogrid{opacity:.25;pointer-events:none}
.pause-msg{position:absolute;inset:60px 0 auto;text-align:center;font:600 18px var(--display)}
.confirm{margin:12px 16px 0;background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qmap{display:flex;flex-wrap:wrap;gap:3px}
.qmap span{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;font:600 10px var(--mono);color:#fff}
.qmap .d{background:var(--ok)} .qmap .y{background:var(--bad)} .qmap .b{background:var(--neutral);color:var(--ink)} .qmap .n{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:80;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.src{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;background:var(--surface-2)}
.sw{font:600 18px var(--mono);font-variant-numeric:tabular-nums;min-width:64px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:8px}
.notes li:last-child{border-bottom:0}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.stu .card.on{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.task{flex-direction:column;align-items:stretch}
.task .tbtns{display:flex;flex-direction:row;justify-content:flex-end;gap:8px;flex:none}
.task.edit{flex-direction:column;align-items:stretch;gap:6px;background:var(--accent-soft)}
.task.edit select,.task.edit input{width:100%;font-size:13px;padding:5px 7px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2);border-radius:7px;padding:6px 8px;font-size:14px}
.pitem select,.pitem input[type=text]{flex:1 1 180px;font-size:13px;padding:4px 6px}
.pitem select.wsel{flex:0 1 160px}
.pitem.done .pname,.pitem.done select:not(.wsel),.pitem.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.pname{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.src a{color:var(--accent)}
input[type=file]{max-width:100%;font-size:14px}
.pv{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pv-top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.pv-top h2{font-size:16px;min-width:0;overflow-wrap:anywhere}
.pv-b{flex:1;overflow:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
.pv-p{margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pv-p canvas{display:block;width:100%;height:auto}
.mx th{white-space:normal;vertical-align:bottom}
.mx td{vertical-align:middle}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px;max-width:210px}
.mx th:not(:first-child),.mx td:not(:first-child){min-width:286px}
.mxh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.mxh b{color:var(--ink);font-size:14px;font-weight:600}
.mxc{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mxb{width:40px;min-height:38px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface-2);cursor:pointer;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font:600 12px var(--mono);color:var(--muted)}
.mxb small{font:500 10px var(--mono);color:inherit}
.mxb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mxb.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.mxpm{display:inline-flex;gap:4px;margin-left:2px}
.mxs{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;color:var(--muted);font:600 14px/1 var(--mono);padding:0}
.mxs:hover{border-color:var(--muted);color:var(--ink)}
body.smode [data-a="del"],body.smode [data-a="mxMinus"],body.smode [data-a="mxClear"],body.smode [data-a="pastRm"],body.smode [data-a="clearPlan"]{display:none!important}
.mode{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px}
.tkt{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font:600 12px var(--mono);background:var(--surface-2);cursor:pointer}
.tkt.done{color:var(--ok);border-color:var(--ok)}
.tkt input{width:15px;height:15px}
.task.extra{background:var(--extra-soft);box-shadow:inset 3px 0 0 var(--extra)}
.pill.ext{background:var(--extra);color:var(--surface)}
body.smode .coach,body.smode [data-a="copyWeek"],body.smode [data-a="openPlan"]{display:none!important}
@media (min-width:900px){body.split .pv{right:42%;border-right:1px solid var(--line)}body.split .ov{left:58%}}
@media (max-width:899.98px){body.split .pv{bottom:50%;border-bottom:2px solid var(--muted)}body.split .ov{top:50%}}
body.pmode .coach,body.pmode .noparent,body.pmode .mxpm,body.pmode .tbtns,body.pmode [data-a="del"],body.pmode [data-a="planToTask"],body.pmode [data-a="openPlan"],body.pmode .ph-r [data-a="go"],body.pmode .who,body.pmode [data-a="optik"]{display:none!important}
body.pmode main input,body.pmode main select,body.pmode main textarea,body.pmode .mxb{pointer-events:none}
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;display:grid;place-items:center;padding:24px 16px}
.gate-c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.gate-c .f input{width:100%}
.gate-c .brand{margin-bottom:4px}
.gate-links{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between}
.banner{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.dlg-bg{position:fixed;inset:0;z-index:70;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px}

<script>
const KEY='k-kocluk-v1', LET='ABCDE';
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const EXAMS=['LGS','Bursluluk (İOKBS)','Özel okul bursluluk','TYT','AYT','Diğer'];
const GRADES=['4','5','6','7','8','9','10','11','12','Mezun'];
const STATUS={none:'Başlanmadı',doing:'Çalışılıyor',done:'Tamamlandı'};
const QTYPE={genel:'Genel',paragraf:'Paragraf',problem:'Problem'};

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const fmt=s=>parse(s).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
const fmtSec=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`};
const secWords=s=>{s=Math.round(s);if(s<60)return `${s} sn`;const m=Math.floor(s/60),x=s%60;return x?`${m} dk ${x} sn`:`${m} dk`};
const n2=v=>(Math.round(v*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2});
const pct=(a,b)=>b?Math.round(a*100/b):0;
const sum=(arr,k)=>arr.reduce((t,x)=>t+(+x[k]||0),0);

/* ---------- örnek veri ---------- */
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function mkCur(){
  const def=[
    ['tr','Türkçe',20,['Sözcükte Anlam','Cümlede Anlam','Paragraf','Fiilimsiler','Cümlenin Ögeleri','Fiilde Çatı','Cümle Türleri','Yazım Kuralları','Noktalama İşaretleri','Söz Sanatları','Metin Türleri']],
    ['mat','Matematik',20,['Çarpanlar ve Katlar','Üslü İfadeler','Kareköklü İfadeler','Veri Analizi','Basit Olayların Olma Olasılığı','Cebirsel İfadeler ve Özdeşlikler','Doğrusal Denklemler','Eşitsizlikler','Üçgenler','Eşlik ve Benzerlik','Dönüşüm Geometrisi','Geometrik Cisimler']],
    ['fen','Fen Bilimleri',20,['Mevsimler ve İklim','DNA ve Genetik Kod','Basınç','Madde ve Endüstri','Basit Makineler','Enerji Dönüşümleri ve Çevre Bilimi','Elektrik Yükleri ve Elektrik Enerjisi']],
    ['ink','T.C. İnkılap Tarihi',10,['Bir Kahraman Doğuyor','Millî Uyanış','Ya İstiklal Ya Ölüm','Çağdaş Türkiye Yolunda Adımlar','Demokratikleşme Çabaları','Atatürk Dönemi Dış Politika','Atatürk\'ün Ölümü ve Sonrası']],
    ['din','Din Kültürü',10,['Kader İnancı','Zekât ve Sadaka','Din ve Hayat','Hz. Muhammed\'in Örnekliği','Kur\'an-ı Kerim ve Özellikleri']],
    ['ing','İngilizce',10,['Friendship','Teen Life','In the Kitchen','On the Phone','The Internet','Adventures','Tourism','Chores','Science','Natural Forces']]
  ];
  return {id:'cur-lgs8',name:'8. Sınıf LGS',exam:'LGS',grade:'8',wrongRatio:3,options:4,
    subjects:def.map(([id,name,count,t])=>({id,name,count,topics:t.map((n,i)=>({id:`${id}-${i+1}`,name:n}))}))};
}
function mkSection(sb,opt){const n=Math.max(1,+sb.count||10);return {subj:sb.id,count:n,options:opt||4,key:Array(n).fill(null),topics:Array(n).fill(null),answers:Array(n).fill(null),seconds:0}}
function newExam(s,name,date){const cur=curOf(s,true);return {id:uid(),sid:s.id,curId:cur.id,name,date,done:false,durationSec:0,sections:cur.subjects.map(sb=>mkSection(sb,cur.options))}}
function seed(){
  const cur=mkCur(), r=rng(7), t0=today(), mon=mondayOf(t0), ti=(t0.getDay()+6)%7;
  const s1={id:'s1',name:'Örnek Öğrenci',grade:'8',exam:'LGS',curId:cur.id,parent:'Örnek Veli',parentEmail:'veli@ornek.com',parentPhone:'',
    startDate:iso(addDays(mon,-28)),examDate:DEF_EXAM(),reviewWeeks:2,autoPlan:true,
    sources:['MEB ders kitabı','Soru bankası A','Konu anlatım fasikülü','Video ders'],
    notes:[{id:uid(),date:iso(addDays(t0,-3)),text:'Paragraf sorularında süre uzuyor; günde 20 paragraf sorusuna çıkıyoruz.'},{id:uid(),date:iso(addDays(t0,-9)),text:'Deneme sonrası konuşma: Basınç konusunu kendi tekrar edecek.'}],
    reportNote:'Bu hafta paragraf süresi belirgin şekilde kısaldı. Matematikte üslü ve kareköklü ifadelerde ek tekrar planladık.',sample:true};
  const s2={id:'s2',name:'Örnek Öğrenci 2',grade:'8',exam:'LGS',curId:cur.id,parent:'',parentEmail:'',parentPhone:'',sources:['MEB ders kitabı'],notes:[],reportNote:'',sample:true};
  const S0={v:1,students:[s1,s2],active:'s1',curricula:[cur],tasks:[],questions:[],exams:[],progress:{s1:{},s2:{}},plans:{},
    ui:{view:'ozet',week:0,examId:null,examMode:null,curId:null,editStudent:null,openSec:0}};
  const T=(sub,ti)=>cur.subjects.find(x=>x.id===sub).topics[ti].id;
  const plan=[[0,'mat',1,'Konu tekrarı + 30 soru',30],[0,'tr',2,'Paragraf, süre tutarak',20],[1,'fen',2,'Konu anlatımı videosu + 25 soru',25],[1,'ing',1,'Kelime listesi + 15 soru',15],
    [2,'mat',2,'Kareköklü ifadeler 30 soru',30],[2,'tr',3,'Fiilimsiler 20 soru',20],[3,'ink',1,'Konu özeti çıkar',0],[3,'tr',2,'Paragraf 20 soru',20],
    [4,'mat',8,'Üçgenler giriş',20],[4,'din',0,'Test 15 soru',15],[5,'fen',3,'Madde ve Endüstri 25 soru',25],[6,'mat',1,'Haftalık tekrar testi',25]];
  for(const w of [-1,0]) plan.forEach(([d,sub,t,txt,tg])=>{const date=addDays(mon,w*7+d);S0.tasks.push({id:uid(),sid:'s1',date:iso(date),subj:sub,topic:T(sub,t),text:txt,target:tg,done:w<0?r()<.85:d<ti||(d===ti&&r()<.5)})});
  for(let i=13;i>=0;i--){const date=iso(addDays(t0,-i));const k=1+Math.floor(r()*3);
    for(let j=0;j<k;j++){const sb=cur.subjects[Math.floor(r()*cur.subjects.length)];let type='genel',sub=sb.id,tp=sb.topics[Math.floor(r()*sb.topics.length)].id;
      if(j===0&&i%2===0){type='paragraf';sub='tr';tp='tr-3'} else if(j===1&&i%3===0){type='problem';sub='mat';tp='mat-7'}
      const c=10+Math.floor(r()*4)*5, d=Math.round(c*(.6+r()*.3)), y=Math.round((c-d)*.7);
      const per=type==='paragraf'?(78-(13-i)*2+r()*10):type==='problem'?(105-(13-i)*1.5+r()*14):(55+r()*25);
      S0.questions.push({id:uid(),sid:'s1',date,subj:sub,topic:tp,type,count:c,d,y,sec:Math.round(per*c)})}}
  const prog=S0.progress.s1;
  cur.subjects.forEach(sb=>sb.topics.forEach((t,i)=>{const f=i/sb.topics.length;const st=f<.34?'done':f<.5?'doing':'none';if(st!=='none')prog[t.id]={status:st,source:s1.sources[Math.floor(r()*3)]}}));
  const mkE=(name,off,skill,done)=>{const ex={id:uid(),sid:'s1',curId:cur.id,name,date:iso(addDays(t0,off)),done:false,durationSec:0,sections:[]};
    ex.sections=cur.subjects.map(sb=>{const sec=mkSection(sb,4);sec.key=sec.key.map(()=>LET[Math.floor(r()*4)]);
      sec.topics=sec.topics.map((_,i)=>sb.topics[Math.min(sb.topics.length-1,Math.floor(i*sb.topics.length/sec.count))].id);
      if(done){const p=skill[sb.id];sec.answers=sec.key.map(k=>{const x=r();if(x<p)return k;if(x<p+(1-p)*.65){let w;do{w=LET[Math.floor(r()*4)]}while(w===k);return w}return null});sec.seconds=sec.count*(48+Math.floor(r()*40))}
      return sec});
    if(done){ex.done=true;ex.durationSec=ex.sections.reduce((t,s)=>t+s.seconds,0)}return ex};
  S0.exams.push(mkE('Deneme 1',-24,{tr:.7,mat:.5,fen:.6,ink:.7,din:.8,ing:.65},true));
  S0.exams.push(mkE('Deneme 2',-10,{tr:.78,mat:.58,fen:.66,ink:.8,din:.85,ing:.7},true));
  S0.exams.push(mkE('Deneme 3',0,{},false));
  return S0;
}

/* ---------- durum ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return o}}catch(e){}return seed()}
function DEF_EXAM(){const t=today();const y=t.getMonth()>=6?t.getFullYear()+1:t.getFullYear();return `${y}-06-06`}
function migrate(o){o.plans=o.plans||{};o.books=Array.isArray(o.books)?o.books:[];o.progress=o.progress||{};(o.students||[]).forEach(s=>{if(!s.startDate)s.startDate=iso(mondayOf(today()));if(!s.examDate)s.examDate=DEF_EXAM();if(s.reviewWeeks==null)s.reviewWeeks=2;if(!Array.isArray(s.curIds))s.curIds=s.curId?[s.curId]:[];if(s.curId&&!s.curIds.includes(s.curId))s.curIds.unshift(s.curId);if(s.planBuilt&&s.planEdited==null)s.planEdited=true});return o}
function init(o){S=migrate(o);S.ui=Object.assign({view:'ozet',week:0,examId:null,examMode:null,curId:null,editStudent:null,editTask:null,openSec:0},S.ui||{});
  S.students.forEach(s=>{if(!s.autoPlan)return;delete s.autoPlan;
    const cur=curOf(s),W=plan(s.id).weeks,past=planWeeks(s).filter(k=>k<curMon());
    if(past.length)cur.subjects.forEach(sb=>{const dn=sb.topics.filter(t=>prog(s.id)[t.id]?.status==='done');dn.forEach((t,i)=>{const k=past[Math.floor(i*past.length/dn.length)];(W[k]||(W[k]=[])).push({id:uid(),subj:sb.id,topic:t.id})})});
    buildPlan(s)})}
let S;
function save(){if(STUDENT){stuSync();return}if(VIEW||!AUTHU)return;try{localStorage.setItem(KEY+':'+AUTHU.id,JSON.stringify(S));localStorage.setItem(KEY+':pending:'+AUTHU.id,'1')}catch(e){}cloudDirty()}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

const st=()=>S.students.find(s=>s.id===S.active)||S.students[0];
const curById=id=>S.curricula.find(c=>c.id===id);
function curOf(s,strict){return curById(s&&s.curId)||S.curricula[0]||{id:'none',name:'—',subjects:[],wrongRatio:0,options:4}}
const subj=(cur,id)=>cur.subjects.find(x=>x.id===id);
const subjName=(cur,id)=>subj(cur,id)?.name||S.curricula.map(c=>subj(c,id)).find(Boolean)?.name||'—';
const curOfSubj=id=>S.curricula.find(c=>subj(c,id));
const inCur=(cur,it)=>it.topic?cur.subjects.some(sb=>sb.topics.some(t=>t.id===it.topic)):(!it.cur||it.cur===cur.id);
function topicOf(cur,tid){for(const c of [cur,...S.curricula])for(const sb of c.subjects){const t=sb.topics.find(x=>x.id===tid);if(t)return {t,sb}}return null}
const topicName=(cur,tid)=>topicOf(cur,tid)?.t.name||(tid?'(silinmiş konu)':'—');
function weekRange(off){const m=addDays(mondayOf(today()),off*7);return {a:iso(m),b:iso(addDays(m,6)),mon:m}}
const inR=(d,w)=>d>=w.a&&d<=w.b;
const prog=(sid)=>S.progress[sid]||(S.progress[sid]={});

/* ---------- konu planı ---------- */
const plan=sid=>S.plans[sid]||(S.plans[sid]={weeks:{}});
const curMon=()=>iso(mondayOf(today()));
function planWeeks(s){const a=mondayOf(parse(s.startDate)),b=mondayOf(parse(s.examDate));const out=[];for(let d=a;d<=b&&out.length<80;d=addDays(d,7))out.push(iso(d));
  const W=plan(s.id).weeks;Object.keys(W).forEach(k=>{if(!out.includes(k)&&W[k].length)out.push(k)});return out.sort()}
const weekNo=(s,k)=>Math.round((parse(k)-mondayOf(parse(s.startDate)))/(7*864e5))+1;
const weekLbl=(s,k)=>{const n=weekNo(s,k);return `${n>0?n+'. hafta':'Başlangıç öncesi'} · ${fmt(k)}`};
function itemDone(s,it){return it.topic?prog(s.id)[it.topic]?.status==='done':!!it.done}
const itemName=(cur,it)=>it.topic?topicName(cur,it.topic):(it.name||'—');
function setDone(s,tid,v){const p=prog(s.id);(p[tid]||(p[tid]={})).status=v?'done':'none'}
function pastWeeksOf(s,tid){const W=plan(s.id).weeks,cm=curMon();return Object.keys(W).sort().filter(k=>k<cm&&W[k].some(i=>i.topic===tid))}
function dropTopic(s,tid,pred){const W=plan(s.id).weeks;for(const k in W)if(pred(k))W[k]=W[k].filter(i=>i.topic!==tid)}
function findItem(s,x){const [k,id]=x.split('|');const W=plan(s.id).weeks;return {k,W,it:(W[k]||[]).find(i=>i.id===id)}}
function buildPlan(s){
  const cur=curOf(s),W=plan(s.id).weeks,cm=curMon(),p=prog(s.id);
  for(const k in W)if(k>=cm)delete W[k];
  const all=planWeeks(s).filter(k=>k>=cm);
  const rw=Math.min(Math.max(0,+s.reviewWeeks||0),Math.max(0,all.length-1));
  const study=all.slice(0,all.length-rw),review=all.slice(all.length-rw);
  if(!study.length)return -1;
  let n=0;
  cur.subjects.forEach(sb=>{const rest=sb.topics.filter(t=>p[t.id]?.status!=='done');
    rest.forEach((t,i)=>{const k=study[Math.floor(i*study.length/rest.length)];(W[k]||(W[k]=[])).push({id:uid(),subj:sb.id,topic:t.id});n++})});
  review.forEach(k=>(W[k]||(W[k]=[])).push({id:uid(),subj:null,topic:null,name:'Genel tekrar ve deneme'}));
  s.planBuilt=true;s.planEdited=false;return n}
const touch=(s,k)=>{if(k>=curMon())s.planEdited=true};
function adjust(s,tid){const cm=curMon();if(!s.planEdited)return buildPlan(s)>=0;
  const W=plan(s.id).weeks;
  if(prog(s.id)[tid]?.status==='done'){dropTopic(s,tid,k=>k>=cm);return true}
  if(Object.keys(W).some(k=>k>=cm&&W[k].some(i=>i.topic===tid)))return true;
  const all=planWeeks(s).filter(k=>k>=cm),rw=Math.min(Math.max(0,+s.reviewWeeks||0),Math.max(0,all.length-1)),study=all.slice(0,all.length-rw);if(!study.length)return false;
  const sb=topicOf(curOf(s),tid)?.sb,k=study.reduce((a,b)=>((W[b]||[]).length<(W[a]||[]).length?b:a));(W[k]||(W[k]=[])).push({id:uid(),subj:sb?.id,topic:tid});return true}
const OPENW=new Set(),OPENP=new Set();

function keyMissing(ex){return ex.sections.reduce((t,s)=>t+s.key.filter(k=>!k).length,0)}
function scoreExam(ex){
  const cur=curById(ex.curId)||curOf(null), ratio=+cur.wrongRatio||0;
  const secs=[],topics={};let D=0,Y=0,B=0,N=0;
  ex.sections.forEach(s=>{let d=0,y=0,b=0,nk=0;
    s.key.forEach((k,i)=>{if(!k){nk++;return}const a=s.answers[i];const tid=s.topics[i]||('_'+s.subj);const T=topics[tid]||(topics[tid]={tid,subj:s.subj,n:0,d:0,y:0,b:0});T.n++;
      if(!a){b++;T.b++}else if(a===k){d++;T.d++}else{y++;T.y++}});
    const net=ratio?d-y/ratio:d;secs.push({subj:s.subj,name:subjName(cur,s.subj),n:s.count,d,y,b,nk,net,sec:s.seconds});D+=d;Y+=y;B+=b;N+=net});
  return {cur,secs,topics:Object.values(topics),d:D,y:Y,b:B,net:N,total:ex.sections.reduce((t,s)=>t+s.count,0)};
}
const doneExams=(s,cid)=>S.exams.filter(e=>e.sid===s.id&&e.done&&(!cid||e.curId===cid)).sort((a,b)=>a.date<b.date?-1:1);
function weakTopics(s,lim=6){const agg={};doneExams(s,curOf(s).id).forEach(e=>scoreExam(e).topics.forEach(t=>{const A=agg[t.tid]||(agg[t.tid]={tid:t.tid,subj:t.subj,n:0,d:0,y:0,b:0});A.n+=t.n;A.d+=t.d;A.y+=t.y;A.b+=t.b}));
  return Object.values(agg).filter(a=>a.n>=2&&!a.tid.startsWith('_'))}
function topicPct(s,cur){const all=cur.subjects.flatMap(x=>x.topics);const p=prog(s.id);const d=all.filter(t=>p[t.id]?.status==='done').length;return {d,n:all.length}}

/* ---------- ortak parçalar ---------- */
const optSubj=(cur,sel)=>cur.subjects.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
const optTopic=(cur,sid,sel,blank='— konu seç —',other=false)=>`<option value="">${blank}</option>`+(subj(cur,sid)?.topics||[]).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('')+(other?`<option value="__other" ${sel==='__other'?'selected':''}>Diğer (listede yok, kendim yazacağım)…</option>`:'');
const opts=(arr,sel)=>arr.map(v=>{const [val,lab]=Array.isArray(v)?v:[v,v];return `<option value="${esc(val)}" ${String(val)===String(sel)?'selected':''}>${esc(lab)}</option>`}).join('');
const delBtn=(k,id,label='Sil')=>`<button class="btn sm link" data-a="del" data-k="${k}" data-id="${esc(id)}">${label}</button>`;
function head(title,right=''){const s=st();const eb=s?`${esc(s.name)} · ${esc(s.grade)}${/^\d/.test(s.grade)?'. sınıf':''} · ${esc((s.curIds||[]).length>1?curOf(s).name:s.exam)}`:'k-Koçluk';
  return `<header class="ph"><div><p class="eyebrow">${eb}</p><h1>${title}</h1></div><div class="ph-r">${right}</div></header>`}
function weekNav(){const w=weekRange(S.ui.week);return `<button class="btn sm" data-a="week" data-d="-1" aria-label="Önceki hafta">‹</button><span class="num">${fmt(w.a)} – ${fmt(w.b)}</span><button class="btn sm" data-a="week" data-d="1" aria-label="Sonraki hafta">›</button>${S.ui.week?'<button class="btn sm link" data-a="week" data-d="0">Bu hafta</button>':''}`}
const noStudent=()=>`${head('Önce bir öğrenci ekle')}<div class="card"><p>Takip için en az bir öğrenci gerekiyor.</p><div><button class="btn primary" data-a="go" data-v="ogrenciler">Öğrenci ekle</button></div></div>`;
const bar=(v,cls='')=>`<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`;

function niceMax(v){if(v<=0)return 10;const p=10**Math.floor(Math.log10(v));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function lineChart(pts,label){
  if(!pts.length)return `<p class="empty">Henüz tamamlanmış deneme yok.</p>`;
  const W=480,H=210,L=40,R=22,T=26,B=32,ym=niceMax(Math.max(...pts.map(p=>p.v))*1.12);
  const x=i=>pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1),y=v=>T+(H-T-B)*(1-v/ym);
  let g='';for(let k=0;k<=4;k++){const v=ym*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L-8}" y="${y(v)+4}" text-anchor="end">${n2(v)}</text>`}
  const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ');
  const area=pts.length>1?`<polygon class="ar" points="${x(0)},${y(0)} ${line} ${x(pts.length-1)},${y(0)}"/>`:'';
  const step=Math.ceil(pts.length/8);
  const lbls=pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text class="lbl" x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`:'').join('');
  const dots=pts.map((p,i)=>`<circle class="pt ${i===pts.length-1?'end':''}" cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5.5:4}"><title>${esc(p.label)}: ${n2(p.v)}</title></circle>`).join('');
  const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${area}${pts.length>1?`<polyline class="ln" points="${line}"/>`:''}${dots}<text class="val" x="${Math.min(x(pts.length-1),W-R-4)}" y="${y(lp.v)-12}" text-anchor="${pts.length>1?'end':'middle'}">${n2(lp.v)}</text>${lbls}</svg>`;
}
function weekBars(days){
  const W=480,H=200,L=36,R=10,T=16,B=28,ym=niceMax(Math.max(10,...days.map(d=>d.d+d.y+d.b)));
  const cw=(W-L-R)/days.length,bw=Math.min(44,cw*.56),y=v=>T+(H-T-B)*(1-v/ym);
  let g='';for(let k=0;k<=4;k++){const v=ym*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  const bars=days.map((d,i)=>{const cx=L+cw*i+cw/2,x0=cx-bw/2;let base=0,out='';
    [['d','b-d'],['y','b-y'],['b','b-b']].forEach(([k,c])=>{const v=d[k];if(v>0){out+=`<rect class="${c}" x="${x0}" y="${y(base+v)}" width="${bw}" height="${y(base)-y(base+v)}"/>`;base+=v}});
    return out+(base?`<text class="val" x="${cx}" y="${y(base)-5}" text-anchor="middle">${base}</text>`:'')+`<text class="lbl" x="${cx}" y="${H-10}" text-anchor="middle">${d.label}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Günlük çözülen soru">${g}${bars}</svg>`;
}

function reportText(s){
  const cur=curOf(s),w=weekRange(S.ui.week);
  const tasks=S.tasks.filter(t=>t.sid===s.id&&inR(t.date,w)&&!t.extra),td=tasks.filter(t=>t.done).length;
  const qs=S.questions.filter(q=>q.sid===s.id&&inR(q.date,w)),c=sum(qs,'count'),d=sum(qs,'d'),y=sum(qs,'y');
  const sp=t=>{const x=qs.filter(q=>q.type===t&&q.sec);const n=sum(x,'count');return n?secWords(sum(x,'sec')/n):null};
  const ex=doneExams(s,cur.id).filter(e=>e.date<=w.b),l=ex[ex.length-1],p=ex[ex.length-2];
  const wk=weakTopics(s);const weak=wk.slice().sort((a,b)=>(b.y+b.b)/b.n-(a.y+a.b)/a.n).slice(0,4).map(a=>topicName(cur,a.tid));
  const strong=wk.filter(a=>a.n>=3).sort((a,b)=>b.d/b.n-a.d/a.n).slice(0,3).map(a=>topicName(cur,a.tid));
  const L=[`${s.name} · Haftalık gelişim raporu (${fmt(w.a)} – ${fmt(w.b)})`,'',
    `Görevler: ${td}/${tasks.length} tamamlandı (%${pct(td,tasks.length)})`,
    `Çözülen soru: ${c} (doğru ${d}, yanlış ${y}, boş ${c-d-y}) · başarı %${pct(d,c)}`];
  const exn=S.tasks.filter(t=>t.sid===s.id&&inR(t.date,w)&&t.extra).length;if(exn)L.push(`Programın dışında fazladan çalışma: ${exn} kayıt`);
  const a=sp('paragraf'),b=sp('problem');if(a||b)L.push(`Soru başına süre: ${[a&&'paragraf '+a,b&&'problem '+b].filter(Boolean).join(', ')}`);
  if(l){const r=scoreExam(l);L.push(`Son deneme: ${l.name} (${fmt(l.date)}) · ${n2(r.net)} net`+(p?` (önceki ${n2(scoreExam(p).net)})`:''))}
  if(strong.length)L.push(`Güçlü konular: ${strong.join(', ')}`);
  if(weak.length)L.push(`Üzerinde çalışacağımız konular: ${weak.join(', ')}`);
  if(s.reportNote)L.push('',`Koç yorumu: ${s.reportNote}`);
  return L.join('\n');
}

const nrm=x=>String(x).toLocaleLowerCase('tr').replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u').replace(/[^a-zçğıöşü0-9]/g,'');
function loadLgsPast(cur){const P=pastOf(cur),D=LGS_PAST;let hit=0,added=0;const miss=[];
  P.years=[...new Set([...P.years,...D.years])].sort();
  D.subj.forEach(ds=>{const sb=cur.subjects.find(x=>{const n=nrm(x.name);return ds.k==='din'?n.startsWith('din'):n.includes(nrm(ds.k))});
    if(!sb){miss.push(ds.k+' dersi');return}const taken=new Set();
    const find=al=>{const a=al.map(nrm);return sb.topics.find(t=>!taken.has(t.id)&&a.includes(nrm(t.name)))||sb.topics.find(t=>!taken.has(t.id)&&a.some(z=>z.length>5&&(nrm(t.name).includes(z)||(nrm(t.name).length>5&&z.includes(nrm(t.name))))))};
    ds.t.forEach(([al,nums,add])=>{let t=find(al);if(!t){if(!add){if(nums.some(Boolean))miss.push(al[0]);return}t={id:uid(),name:al[0]};sb.topics.push(t);added++}else hit++;
      taken.add(t.id);const c=P.counts[t.id]||(P.counts[t.id]={});D.years.forEach((y,i)=>{if(nums[i])c[y]=nums[i];else delete c[y]})})});
  cur.pastNote=`Hazır dağılım yüklendi: ${hit} konu eşleşti${added?`, ${added} konu müfredata eklendi`:''}${miss.length?`. Müfredatta karşılığı bulunamayanlar: ${miss.join(', ')}`:''}.`}

function loadPdfLib(){return new Promise((res,rej)=>{if(window.PDFLib)return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';sc.onload=()=>res();sc.onerror=()=>rej({code:'split'});document.head.appendChild(sc)})}
async function splitPdf(file){
  let src;try{await loadPdfLib();src=await PDFLib.PDFDocument.load(new Uint8Array(await file.arrayBuffer()))}catch(e){console.log('[k-Koçluk] pdf',e);throw {code:'split'}}
  const n=src.getPageCount();
  const part=async(a,b)=>{let bytes;try{const doc=await PDFLib.PDFDocument.create();(await doc.copyPages(src,Array.from({length:b-a},(_,i)=>a+i))).forEach(pg=>doc.addPage(pg));bytes=await doc.save()}catch(e){console.log('[k-Koçluk] pdf',e);throw {code:'split'}}
    if(bytes.length>LIM){if(b-a<2)throw {code:'too_large'};const m=(a+b)>>1;return [...await part(a,m),...await part(m,b)]}
    return [{blob:new Blob([bytes],{type:'application/pdf'}),label:`s. ${a+1}–${b}`}]};
  const k=Math.min(n,Math.max(2,Math.ceil(file.size/(LIM*.8))));let out=[];
  for(let i=0;i<k;i++){const a=Math.floor(i*n/k),b=Math.floor((i+1)*n/k);if(b>a)out=out.concat(await part(a,b))}
  return out}

  const name=file.name.replace(/\.pdf$/i,'');let parts;
  if(file.size<=LIM)parts=[{blob:file,label:''}];else{bkMsg(`${name}: dosya büyük, parçalara bölünüyor…`);parts=await splitPdf(file)}
  for(let i=0;i<parts.length;i++){bkMsg(`${name}: yükleniyor${parts.length>1?` (${i+1}/${parts.length})`:''}…`);const r=await up(parts[i].blob);

async function pvLayout(){const my=PV,b=document.getElementById('pv-b');if(!my||!my.doc||!b)return;if(my.io)my.io.disconnect();

  const draw=async el=>{if(el.dataset.on)return;el.dataset.on='1';try{const pg=await my.doc.getPage(+el.dataset.n),v1=pg.getViewport({scale:1}),dpr=Math.min(2,window.devicePixelRatio||1),vp=pg.getViewport({scale:Math.max(.2,el.clientWidth*dpr/v1.width)});

VIEWS.veli=()=>{

  const qs=S.questions.filter(q=>q.sid===s.id&&inR(q.date,w)),qc=sum(qs,'count'),qd=sum(qs,'d');
  const ex=doneExams(s,cur.id),sc=ex.map(e=>({e,r:scoreExam(e)})),upto=sc.filter(x=>x.e.date<=w.b),last=upto[upto.length-1],prev=upto[upto.length-2],diff=last&&prev?last.r.net-prev.r.net:null;
  const tp=topicPct(s,cur),weak=weakTopics(s).sort((a,b)=>(b.y+b.b)/b.n-(a.y+a.b)/a.n||(b.y+b.b)-(a.y+a.b)).slice(0,5);

    <div class="tile"><span class="k">Konu ilerlemesi</span><span class="v">%${pct(tp.d,tp.n)}</span><span class="s">${tp.d}/${tp.n} konu tamamlandı</span></div>
  </section>

    <section class="card"><div class="card-h"><h2>Koçun yorumu</h2><small>${esc(PARENT?PARENT.coach:'')}</small></div>${s.reportNote?`<p style="white-space:pre-wrap">${esc(s.reportNote)}</p>`:'<p class="empty">Koç henüz bir yorum yazmadı.</p>'}</section>

      d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">Giriş bilgisi hazır</h2><p class="muted">Bunu ${esc(x?x.name:'öğrenci')} ile paylaş. Şifre bir daha gösterilmez; unutulursa buradan yenisini verirsin.</p>
        <textarea id="sa-out" rows="5" readonly>k-Koçluk öğrenci girişi
Adres: ${esc(location.origin+location.pathname+'#ogrenci')}
Kullanıcı adı: ${esc(v.username)}
Şifre: ${esc(pw)}</textarea>
        <div class="dlg-b"><button class="btn" data-a="askNo">Kapat</button><button class="btn primary" data-a="saCopy">Kopyala</button></div></div>`;render()}
    catch(e){toast(/coach_set_student_login|schema|function/i.test(e.message||'')?'Öğrenci girişi için 03 numaralı SQL dosyasını Supabase\'de çalıştırman gerekiyor':aerr(e))}},
  saCopy:()=>copyFrom('sa-out','Giriş bilgisi kopyalandı'),
  saRemove:()=>{if(!SAE)return;const id=SAE.id,x=S.students.find(q=>q.id===id);ask('Emin misin?',`${x?x.name:'Öğrenci'} artık kullanıcı adı ve şifresiyle giremeyecek. Kayıtları silinmez.`,async()=>{
      try{const r=await SB.from('student_accounts').delete().eq('coach_id',AUTHU.id).eq('student_id',id);if(r.error)throw r.error;delete SA.map[id];commit('Öğrenci girişi kaldırıldı')}catch(e){toast(aerr(e))}})},
  signOut:async()=>{if(CLOUD.dirty&&!VIEW){try{await cloudSave()}catch(e){}}try{await SB.auth.signOut()}catch(e){}AUTHU=null;ME=null;VIEW=null;MYS=null;ADM.rows=null;closeOptik&&OPT&&closeOptik();showGate('login')},
  admLoad:()=>admLoad(true),
  admSet:async el=>{const id=el.dataset.id,f=el.dataset.f,v=el.dataset.v==='1';await admUpdate(id,{[f]:v},f==='approved'?(v?'Koç onaylandı':'Onay kaldırıldı'):(v?'Hesap donduruldu':'Dondurma kaldırıldı'))},
  admView:async el=>{const row=(ADM.rows||[]).find(r=>r.id===el.dataset.id);if(!row)return;try{const r=await SB.from('coach_state').select('data').eq('coach_id',row.id).maybeSingle();if(r.error)throw r.error;
      if(!r.data||!r.data.data||r.data.data.v!==1){toast('Bu koçun henüz kaydı yok');return}
      if(CLOUD.dirty)await cloudSave();if(!VIEW)MYS=JSON.stringify(S);VIEW={id:row.id,name:row.full_name||row.email};init(r.data.data);S.stuMode=false;S.ui.view='ozet';S.ui.examId=null;render();window.scrollTo(0,0)}catch(e){toast(aerr(e))}},
  viewExit:()=>{if(!VIEW)return;VIEW=null;const o=MYS?JSON.parse(MYS):seed();MYS=null;init(o);S.ui.view='yonetici';render();window.scrollTo(0,0)},
  admDel:el=>{const row=(ADM.rows||[]).find(r=>r.id===el.dataset.id);if(!row)return;ask('Emin misin?',`“${row.full_name||row.email}” adlı koç ve tüm kayıtları (öğrenciler, planlar, denemeler) kalıcı olarak silinecek. Bu işlem geri alınamaz.`,async()=>{
      try{const r=await SB.rpc('admin_delete_coach',{target:row.id});if(r.error)throw r.error;toast(String(r.data||'Silindi'));await admLoad(true)}catch(e){toast(aerr(e))}})}
});
STU_DENY.add('admDel');STU_DENY.add('saRemove');['stuAcc','saSave'].forEach(x=>STU_COACH.add(x));STU_DENY.add('plRevoke');STU_DENY.add('plRenew');['admSet','admView','admLoad','signOut'].forEach(x=>STU_COACH.add(x));
Object.assign(C,{
  admField:async el=>{const f=el.dataset.f;await admUpdate(el.dataset.id,{[f]:f==='paid_until'?(el.value||null):el.value},f==='paid_until'?'Üyelik tarihi kaydedildi':'Not kaydedildi')}
});
async function admUpdate(id,patch,msg){try{const r=await SB.from('profiles').update(patch).eq('id',id).select('id');if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('Kayıt güncellenemedi');toast(msg);await admLoad(true)}
  catch(e){toast(/column|schema/i.test(e.message||'')?'Bu özellik için güncel SQL dosyasını Supabase\'de çalıştırman gerekiyor':aerr(e));await admLoad(true)}}
async function admLoad(rerender){ADM.busy=true;try{const r=await SB.from('profiles').select('*').order('created_at');if(r.error)throw r.error;let st={};
    try{const q=await SB.from('coach_state').select('coach_id,updated_at,students:data->students');if(!q.error)(q.data||[]).forEach(x=>st[x.coach_id]=x)}catch(e){}
    ADM.rows=r.data.map(p=>Object.assign({},p,{_n:Array.isArray(st[p.id]?.students)?st[p.id].students.filter(x=>!x.sample).length:null,_at:st[p.id]?.updated_at||null}));ADM.err=''}
  catch(e){ADM.err=aerr(e);ADM.rows=ADM.rows||[]}
  ADM.busy=false;if(rerender&&S.ui.view==='yonetici'&&!VIEW)render()}
VIEWS.yonetici=()=>{
  if(ME?.role!=='admin')return VIEWS.ozet();
  if(ADM.rows===null){if(!ADM.busy)admLoad(true);return `${head('Yönetici')}<section class="card"><p class="empty">Koç listesi yükleniyor…</p></section>`}
  const rows=ADM.rows,wait=rows.filter(r=>accessOf(r)==='pending').length;
  const pill=r=>{const a=accessOf(r);return r.role==='admin'?'<span class="pill mut">Yönetici</span>':a==='pending'?'<span class="pill warn">Onay bekliyor</span>':a==='frozen'?'<span class="pill bad">Donduruldu</span>':a==='expired'?'<span class="pill bad">Süresi doldu</span>':'<span class="pill ok">Aktif</span>'};
  const dt=x=>x?new Date(x).toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}):'—';
  return `${head('Yönetici',`<span class="pill mut">${rows.filter(r=>r.role!=='admin').length} koç</span>${wait?`<span class="pill warn">${wait} onay bekliyor</span>`:''}<button class="btn sm" data-a="admLoad">Yenile</button>`)}
  ${ADM.err?`<p class="note" role="alert">${esc(ADM.err)}</p>`:''}
  <section class="card"><div class="card-h"><h2>Nasıl çalışır</h2></div><p class="muted">Yeni kaydolan koç “Onay bekliyor” olarak görünür; onaylayınca uygulamayı kullanmaya başlar. Üyelik bitiş tarihi geçince erişim kendiliğinden kapanır. Dondurmak erişimi hemen kapatır; iki durumda da kayıtlar silinmez. Kalıcı silme geri alınamaz.</p></section>
  <section class="adm">${rows.map(r=>{const me=r.id===AUTHU.id,adm=r.role==='admin';
    return `<article class="card"><div class="card-h"><h2 style="overflow-wrap:anywhere">${esc(r.full_name||r.email||'—')}</h2>${pill(r)}</div>
    <dl class="kv"><dt>E-posta</dt><dd>${esc(r.email||'—')}</dd><dt>Kayıt</dt><dd class="num">${dt(r.created_at)}</dd><dt>Öğrenci</dt><dd class="num">${r._n===null?'—':r._n}</dd><dt>Son değişiklik</dt><dd class="num">${dt(r._at)}</dd></dl>
    ${adm?'':`<div class="row"><label class="f"><span>Üyelik bitiş tarihi</span><input type="date" data-c="admField" data-f="paid_until" data-id="${r.id}" value="${esc(r.paid_until||'')}"></label><label class="f grow"><span>Notun</span><input type="text" data-c="admField" data-f="admin_note" data-id="${r.id}" value="${esc(r.admin_note||'')}" placeholder="Örn. 2026 ücreti alındı"></label></div>`}
    <div class="row" style="gap:6px">${adm?'':(r.approved?`<button class="btn sm" data-a="admSet" data-f="approved" data-v="0" data-id="${r.id}">Onayı kaldır</button>`:`<button class="btn sm primary" data-a="admSet" data-f="approved" data-v="1" data-id="${r.id}">Onayla</button>`)}
      ${adm||!r.approved?'':(r.frozen?`<button class="btn sm primary" data-a="admSet" data-f="frozen" data-v="0" data-id="${r.id}">Dondurmayı kaldır</button>`:`<button class="btn sm" data-a="admSet" data-f="frozen" data-v="1" data-id="${r.id}">Dondur</button>`)}
      ${me?'<span class="muted">Bu senin hesabın</span>':`<button class="btn sm" data-a="admView" data-id="${r.id}">Kayıtlarını gör</button>`}
      ${adm?'':`<button class="btn sm link" data-a="admDel" data-id="${r.id}">Kalıcı sil</button>`}</div></article>`}).join('')}</section>`;
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(CLOUD.dirty)cloudSave()}else if(PARENT){if(document.getElementById('gate').hidden&&!PV)parentEnter(PARENT.tok)}else if(STUDENT)studentRefresh();else cloudRefresh()});
setInterval(()=>{if(document.visibilityState==='visible'){if(STUDENT)studentRefresh();else absorbOps()}},45000);
window.addEventListener('pagehide',()=>{if(STUDENT){if(SQ.length)stuPush()}else if(CLOUD.dirty)cloudSave()});
const PTOK=(location.hash.match(/veli=([a-f0-9]{32,})/)||[])[1]||'';
ASREADY=true;
boot();

</script>
